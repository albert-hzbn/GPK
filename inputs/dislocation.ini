# ============================================================
#  GPK Dislocation Stored-Energy Coupling + Recovery
#
#  Validation of the dislocation-density field rho(x):
#    Test 1  front migration velocity vs v = M (E_rho - sigma/R)
#    Test 1b subcritical nucleus (r0 < R*) shrinks
#    Test 2  static recovery rho(t) = rho0 exp(-r t)
#
#  Stored energy (Taylor): E_rho = 0.5 * alpha_T * mu * b^2 * rho
#  Titanium-like elastic constants; deformed density rho0 ~ 1e14 m^-2.
# ============================================================

[run]
model = dislocation

[grid]
Nz = 1
Ny = 128
Nx = 128
dx = 1.0e-6

[time]
t_end   = 20.0
n_snaps = 20

[thermo]
M0            = 1.0e-11
sigma0        = 0.5
mu            = 4.5e10
b             = 2.95e-10
alphaT        = 0.5
rho0          = 1.0e14
rho_rex       = 0.0
recovery_rate = 0.02

[dislocation]
seed_radius    = 20
recovery_t_end = 100.0

[output]
format  = csv
dir     = output/dislocation
prefix  = disl
compact = false
