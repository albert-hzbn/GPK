# ============================================================
#  GPK Grain Growth — 2-D cubic anisotropy
#  Cubic Wulff shape: σ = σ₀(1 + ε₄(nx⁴+ny⁴−3/5))
#  eps4 = 0.10 gives a pronounced 4-fold boundary pattern.
# ============================================================

[run]
model = grain_growth

[grid]
Nz    = 1           # 2-D
Ny    = 128
Nx    = 128
dx    = 1.0e-6

[time]
t_end   = 0.25
n_snaps = 10

[thermo]
M0     = 1.0e-8
sigma0 = 0.5
eps4   = 0.10       # strong 4-fold anisotropy
D      = 0.0

[output]
format  = csv
dir     = output/grain_growth/anisotropic_2d
prefix  = snap
compact = false

[grain_growth]
n_grains = 80
seed     = 7
