# ============================================================
#  GPK Grain Growth — 3-D cubic anisotropy
#  3-D Wulff shape: σ = σ₀(1 + ε₄(nx⁴+ny⁴+nz⁴ − 3/5))
#  eps4 = 0.06 produces faceted grain shapes in 3-D.
# ============================================================

[run]
model = grain_growth

[grid]
Nz    = 32
Ny    = 64
Nx    = 64
dx    = 1.0e-6

[time]
t_end   = 0.139
n_snaps = 10

[thermo]
M0     = 1.0e-8
sigma0 = 0.5
eps4   = 0.06       # moderate cubic anisotropy
D      = 0.0

[output]
format  = csv
dir     = output/grain_growth/anisotropic_3d
prefix  = snap
compact = false

[grain_growth]
n_grains = 40
seed     = 7
