# ============================================================
#  GPK Grain Growth — 2-D fine-grain (many small grains)
#  High nuclei count on a large 2-D domain.
#  Useful for statistical grain size distribution studies.
# ============================================================

[run]
model = grain_growth

[grid]
Nz    = 1
Ny    = 256
Nx    = 256
dx    = 0.5e-6      # finer cell size [m]

[time]
t_end   = 0.10
n_snaps = 10

[thermo]
M0     = 1.0e-8
sigma0 = 0.5
eps4   = 0.0
D      = 0.0

[output]
format  = csv
dir     = output/grain_growth/fine_grain_2d
prefix  = snap
compact = false

[grain_growth]
n_grains = 300
seed     = 99
