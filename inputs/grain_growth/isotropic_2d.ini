# ============================================================
#  GPK Grain Growth — 2-D isotropic
#  Fast 2-D run; isotropic capillarity only.
#  von Neumann-Mullins: <R>^2 = R0^2 + K*t,  K = 2Mσ/3
# ============================================================

[run]
model = grain_growth

[grid]
Nz    = 1           # 2-D
Ny    = 128
Nx    = 128
dx    = 1.0e-6      # cell size [m]

[time]
t_end   = 0.25      # [s]
n_snaps = 10

[thermo]
M0     = 1.0e-8     # boundary mobility [m^3/(J*s)]
sigma0 = 0.5        # interfacial energy [J/m^2]
eps4   = 0.0        # no anisotropy
D      = 0.0

[output]
format  = csv
dir     = output/grain_growth/isotropic_2d
prefix  = snap
compact = false

[grain_growth]
n_grains = 80
seed     = 42
