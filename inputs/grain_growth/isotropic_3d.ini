# ============================================================
#  GPK Grain Growth — 3-D isotropic
#  3-D curvature-driven coarsening, isotropic grain boundary energy.
#  von Neumann-Mullins: <R>^2 = R0^2 + K*t,  K = 2Mσ/3
# ============================================================

[run]
model = grain_growth

[grid]
Nz    = 32          # depth (3-D)
Ny    = 64
Nx    = 64
dx    = 1.0e-6      # cell size [m]

[time]
t_end   = 0.139     # [s]
n_snaps = 10

[thermo]
M0     = 1.0e-8     # boundary mobility [m^3/(J*s)]
sigma0 = 0.5        # interfacial energy [J/m^2]
eps4   = 0.0
D      = 0.0

[output]
format  = csv
dir     = output/grain_growth/isotropic_3d
prefix  = snap
compact = false

[grain_growth]
n_grains = 40
seed     = 42
