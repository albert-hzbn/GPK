# ============================================================
# GPK Magnetic-Field-Assisted Grain Growth
#
# A Voronoi polycrystal grows under ordinary curvature-driven kinetics PLUS
# a per-grain uniaxial magnetocrystalline anisotropy + Zeeman energy term:
#   E_mag(g) = -Ku*cos^2(g - g_easy_ref) - mu0*Ms*H_ext*cos(g - H_theta)
# Grains whose easy axis (orientation g) is close to the applied field
# direction H_theta have LOWER E_mag and grow at the expense of grains
# whose easy axis is far from H_theta.
#
# Reference values: Nd2Fe14B at room temperature, Ku ~ 4.3e6 J/m^3,
# Ms ~ 1.28e6 A/m. H_ext = 8e5 A/m corresponds to mu0*H ~ 1 T.
#
# Expected result: grains within 15 deg of H_theta grow (AlignedA/A0 > 1),
# grains beyond 75 deg shrink (MisalignedA/A0 < 1).
# ============================================================

[run]
model = magnetic_annealing

[grid]
Nz = 1
Ny = 256
Nx = 256
dx = 1.0e-6

[time]
t_end = 0.0008
n_snaps = 8

[thermo]
M0 = 1.0e-8
sigma0 = 0.324
Ku = 4.3e6
Ms = 1.28e6
H_ext = 8.0e5
H_theta = 0.0

[magnetic_annealing]
n_grains = 150
seed = 42

[output]
format = csv
dir = output/magnetic_annealing
prefix = snap
compact = false
