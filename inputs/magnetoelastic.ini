# ============================================================
# GPK Magnetoelastic (Magnetostriction) Test
#
# Three circular grains at theta = g - H_theta = 0, 45, 90 deg, embedded in
# a matrix whose orientation is fixed at the "magic angle" (54.7356 deg),
# where the magnetostrictive eigenstrain cos^2(theta)-1/3 = 0 -- so only the
# three grains carry a nonzero eigenstrain, reusing the existing elastic
# (Eshelby/Gaussian-smoothing) coupling pipeline.
#
# Reference values: Fe-Ga (Galfenol)-like isotropic magnetostriction,
# lambda_s ~ 2-4e-4. elastic_modulus is the same J/m^3-scale quantity used
# by the existing composition-driven elastic-coupling demos (2*mu*(1+nu)/
# (3*(1-nu))), not a raw shear modulus.
#
# Expected result: E_el(0deg)/E_el(45deg) = 16, E_el(90deg)/E_el(45deg) = 4
# (exact ratios from the cos^2(theta) scaling of the eigenstrain).
# ============================================================

[run]
model = magnetoelastic

[grid]
Ny = 240
Nx = 240
dx = 1.0e-6

[thermo]
M0 = 1.0e-8
sigma0 = 0.5
elastic_modulus = 5.0e7
lambda_s = 3.0e-4
H_theta = 0.0
elastic_smooth_iters = 8

[magnetoelastic]
grain_radius_cells = 20
gap_cells = 20
