# ============================================================
# GPK Nd-Fe-B Grain-Boundary-Phase Wetting
#
# Two T1 (Nd2Fe14B) grains separated by a thin Nd-rich grain-boundary (GB)
# phase, using the same two-grain-plus-phase Mullins-grooving geometry and
# wedge-angle measurement as demos/validate_real_materials.cpp Test 7 (there
# with a vapour phase; here with the GB phase). sigma(T1/GBphase) decreases
# with local Cu content c:
#   sigma_wetting(c) = sigma_gbphase_0 * (1 - k_Cu * c),  clamped >= 0
# Each run uses c_sat = c (uniform Cu content everywhere), so the chemical
# driving force is zero and only the wetting/capillary effect is exercised
# (same convention as the precipitate_breakup demo's c==c_sat runs).
#
# sigma_gb, sigma_gbphase_0 calibrated from Koyama et al. 2021's reported
# T1/T1 and T1/GB-liquid interfacial energies (illustrative, not an
# independent literature measurement of k_Cu).
#
# Expected result: GB-phase penetration ("root_depth") increases
# monotonically with Cu content c_Cu.
# ============================================================

[run]
model = ndfeb_wetting

[grid]
N = 400
dx = 1.0e-6

[thermo]
M0 = 1.0e-8
sigma_gb = 0.5
sigma_gbphase_0 = 3.0
k_Cu = 7.9
Omega = 5.0e8

[ndfeb_wetting]
t_base = 5.0e-2
wedge_window = 20
c_values = 0.0,0.10
