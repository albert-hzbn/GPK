# ============================================================
#  GPK Ostwald Ripening — 3-D input file
#  Physics: capillarity-driven size-selective dissolution
#           small particles dissolve; large ones persist
#           with diffusion: <R>^3 ~ t (LSW theory)
# ============================================================

[run]
model = ostwald_ripening

[grid]
Nz    = 1           # 2-D for speed
Ny    = 128
Nx    = 128
dx    = 0.5e-6      # [m]

[time]
t_end   = 0.15      # [s]
n_snaps = 10

[thermo]
M0     = 5.0e-9
sigma0 = 0.10
eps4   = 0.0
D      = 1.0e-14    # solute diffusivity [m^2/s]
c_sat  = 0.15
Omega  = 5.0e8      # chemical potential scale [J/m^3]

[particles]
n_particles    = 100
r_mean_cells   = 7.0    # median radius in cells
r_lognormal_s  = 0.55   # log-normal width
c_particle     = 0.70   # particle composition
c_matrix       = 0.05   # initial matrix composition
seed           = 999

[output]
format  = csv
dir     = output/ostwald_ripening
prefix  = snap
compact = false
