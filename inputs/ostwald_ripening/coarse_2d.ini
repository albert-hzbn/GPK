# ============================================================
#  GPK Ostwald Ripening — 2-D coarse particles (few, large)
#  Sparse distribution of large particles; slow coarsening.
#  Good for validating R^3 ~ t scaling at long times.
# ============================================================

[run]
model = ostwald_ripening

[grid]
Nz    = 1
Ny    = 256
Nx    = 256
dx    = 0.5e-6

[time]
t_end   = 0.50
n_snaps = 10

[thermo]
M0     = 5.0e-9
sigma0 = 0.10
D      = 1.0e-14
c_sat  = 0.15
Omega  = 5.0e8

[particles]
n_particles   = 30        # few particles
r_mean_cells  = 14.0      # large mean radius
r_lognormal_s = 0.40      # narrower distribution
c_particle    = 0.70
c_matrix      = 0.05
seed          = 222

[output]
format  = csv
dir     = output/ostwald_ripening/coarse_2d
prefix  = snap
compact = false
