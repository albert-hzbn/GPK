# ============================================================
#  GPK Ostwald Ripening — 2-D fine particles (many, small)
#  High-density dispersion; rapid initial dissolution of the
#  smallest particles, Lifshitz-Slyozov-Wagner behaviour.
# ============================================================

[run]
model = ostwald_ripening

[grid]
Nz    = 1
Ny    = 256
Nx    = 256
dx    = 0.5e-6

[time]
t_end   = 0.08
n_snaps = 10

[thermo]
M0     = 5.0e-9
sigma0 = 0.10
D      = 1.0e-14
c_sat  = 0.15
Omega  = 5.0e8

[particles]
n_particles   = 200       # many particles
r_mean_cells  = 4.0       # small mean radius
r_lognormal_s = 0.70      # wider size spread
c_particle    = 0.70
c_matrix      = 0.05
seed          = 333

[output]
format  = csv
dir     = output/ostwald_ripening/fine_2d
prefix  = snap
compact = false
