# ============================================================
#  GPK Ostwald Ripening — 2-D high diffusivity
#  D = 1e-12 (100× faster diffusion) → rapid coarsening,
#  shows transition to interface-limited regime.
# ============================================================

[run]
model = ostwald_ripening

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 0.005
n_snaps = 10

[thermo]
M0     = 5.0e-9
sigma0 = 0.10
D      = 1.0e-12    # 100× faster diffusion
c_sat  = 0.15
Omega  = 5.0e8

[particles]
n_particles   = 80
r_mean_cells  = 6.0
r_lognormal_s = 0.55
c_particle    = 0.70
c_matrix      = 0.05
seed          = 444

[output]
format  = csv
dir     = output/ostwald_ripening/high_diff_2d
prefix  = snap
compact = false
