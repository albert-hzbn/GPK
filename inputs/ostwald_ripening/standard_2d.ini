# ============================================================
#  GPK Ostwald Ripening — 2-D standard
#  Capillarity-driven coarsening; LSW: <R>^3 ~ t
#  Log-normal particle size distribution, moderate density.
# ============================================================

[run]
model = ostwald_ripening

[grid]
Nz    = 1           # 2-D
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 0.15      # [s]
n_snaps = 10

[thermo]
M0     = 5.0e-9
sigma0 = 0.10
D      = 1.0e-14    # solute diffusivity [m^2/s]
c_sat  = 0.15       # saturation composition
Omega  = 5.0e8      # chemical potential scale [J/m^3]

[particles]
n_particles   = 100
r_mean_cells  = 7.0
r_lognormal_s = 0.55
c_particle    = 0.70
c_matrix      = 0.05
seed          = 999

[output]
format  = csv
dir     = output/ostwald_ripening/standard_2d
prefix  = snap
compact = false
