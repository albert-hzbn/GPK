# ============================================================
#  GPK Ostwald Ripening — 3-D standard
#  Full 3-D capillarity coarsening; LSW: <R>^3 ~ t
# ============================================================

[run]
model = ostwald_ripening

[grid]
Nz    = 32          # 3-D
Ny    = 64
Nx    = 64
dx    = 0.5e-6

[time]
t_end   = 0.10
n_snaps = 10

[thermo]
M0     = 5.0e-9
sigma0 = 0.10
D      = 1.0e-14
c_sat  = 0.15
Omega  = 5.0e8

[particles]
n_particles   = 40
r_mean_cells  = 5.0
r_lognormal_s = 0.50
c_particle    = 0.70
c_matrix      = 0.05
seed          = 111

[output]
format  = vtk
dir     = output/ostwald_ripening/standard_3d
prefix  = snap
compact = false
