# ============================================================
# GPK Precipitate Breakup (3-D, fully periodic lamellar stripe), critical d/h
#
# A periodic alpha-phase lamellar stripe array (Ti-6Al-V, 973 K): alpha fills
# x and y COMPLETELY (no beta gap in either direction -- matching GPK's core,
# which already wraps periodically on every axis), split into two grains of
# length d each, giving TWO grain boundaries per period (at x=0, the periodic
# seam, and at x=d) at spacing d. z keeps a genuine alpha/beta gap (slab
# thickness h within Nz), itself periodic too. Grain-boundary grooving /
# pinch-off competes with spheroidisation; the balance sets the critical
# aspect ratio.
#
# d = grain length = GB spacing   h = plate thickness (fixed)
#
# Two face types now (no more finite-plate side faces, since x is fully
# periodic):
# broad face alpha/beta (coherent) sigma_broad = 0.091 J/m^2 (n = +-z)
# alpha/alpha grain boundary (semi-coherent) sigma_side = 0.811 J/m^2 (n = x)
#
# Thickness h is FIXED; grain length d is swept so d/h scans the experimental
# aspect-ratio range. Pure-capillary shape flow (c = c_sat -> dG = 0, D = 0).
# ============================================================

[run]
model = precipitate_breakup

[grid]
# Nx is NOT set here -- computed per d-value as Nx=2d (see [breakup] below).
Ny = 64   # full periodic width (alpha fills y completely, no side faces)
Nz = 64
dx = 5.0e-9

[time]
n_snaps = 50

[thermo]
M0 = 1.0e-9
sigma_broad = 0.091
sigma_side = 0.811
D = 0.0
c_sat = 0.15
c_part = 0.15
c_matrix = 0.15
Omega = 0.0

[breakup]
h_cells = 32   # plate thickness; d_list below keeps the SAME d/h ratios as
               # the original h=24 sweep (scaled x4/3 for finer resolution
               # relative to the ~14-cell Gaussian geometry kernel).
n_steps = 3000
min_piece_frac = 0.25
# h = 32. d/h = d/32 (IDENTICAL ratios to the previous h=24 sweep):
# 32->1.0 64->2.0 96->3.0 128->4.0 144->4.5 160->5.0 192->6.0 224->7.0 256->8.0
d_list = 32,64,96,128,144,160,192,224,256

[output]
format = csv
dir = output/precipitate_breakup
prefix = ar
compact = false
