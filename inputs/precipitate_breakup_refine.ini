# ============================================================
# Refinement sweep: d/h = 1.1 ... 1.9 (between the 1.0 stable / 2.0 BREAK
# bracket found in the main periodic sweep) to pin down (d/h)* more
# precisely. Same model/grid conventions as precipitate_breakup.ini.
# ============================================================

[run]
model = precipitate_breakup

[grid]
Ny = 64
Nz = 64
dx = 5.0e-9

[time]
n_snaps = 50

[thermo]
M0 = 1.0e-9
sigma_broad = 0.091
sigma_side = 0.811
D = 0.0
c_sat = 0.15
c_part = 0.15
c_matrix = 0.15
Omega = 0.0

[breakup]
h_cells = 32
n_steps = 3000
min_piece_frac = 0.25
# d/h: 35->1.09 38->1.19 42->1.31 45->1.41 48->1.50 51->1.59 54->1.69 58->1.81 61->1.91
d_list = 35,38,42,45,48,51,54,58,61

[output]
format = csv
dir = output/precipitate_breakup_refine
prefix = ar
compact = false
