# ============================================================
#  GPK Precipitation — 2-D 4-phase (matrix + 3 precipitate phases)
#  Three competing precipitate phases; phase selection governed
#  by local Gibbs minimisation among neighbouring candidates.
# ============================================================

[run]
model = precipitation

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 5.0e-3
n_snaps = 8

[thermo]
M0       = 2.0e-8
sigma0   = 0.18
D        = 2.0e-9
n_phases = 4
T_ref    = 900.0
# Phase 0 = matrix (parent); phases 1,2,3 = precipitates
a        = 0.0,  -8.0e6,  -7.5e6,  -6.0e6
b        = 0.0,   2.0e7,  -1.0e7,   1.5e7
c2       = 0.0,   2.5e8,   1.8e8,   3.0e8
dT       = 0.0,   1.0e4,   5.0e3,   8.0e3

[initial]
c0          = 0.06
T0          = 870.0
n_seeds     = 30
seed_radius = 2
seed        = 789

[output]
format  = csv
dir     = output/precipitation/four_phase_2d
prefix  = snap
compact = false
