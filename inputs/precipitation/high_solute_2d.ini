# ============================================================
#  GPK Precipitation — 2-D high solute (lean matrix)
#  High c0 = 0.12 → stronger driving force, faster nucleation,
#  denser precipitate distribution.
# ============================================================

[run]
model = precipitation

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 3.0e-3
n_snaps = 8

[thermo]
M0       = 2.0e-8
sigma0   = 0.18
D        = 2.0e-9
n_phases = 3
T_ref    = 900.0
a        = 0.0,  -8.0e6,  -7.5e6
b        = 0.0,   2.0e7,  -1.0e7
c2       = 0.0,   2.5e8,   1.8e8
dT       = 0.0,   1.0e4,   5.0e3

[initial]
c0          = 0.12      # high solute concentration
T0          = 860.0     # lower temperature → stronger undercooling
n_seeds     = 40
seed_radius = 2
seed        = 321

[output]
format  = csv
dir     = output/precipitation/high_solute_2d
prefix  = snap
compact = false
