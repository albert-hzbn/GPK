# ============================================================
#  GPK Precipitation — 2-D low temperature (high driving force)
#  T0 = 820 K (far from T_ref = 900 K); large dT contribution
#  stabilises phase 2, modifying the phase competition outcome.
# ============================================================

[run]
model = precipitation

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 4.0e-3
n_snaps = 8

[thermo]
M0       = 2.0e-8
sigma0   = 0.18
D        = 2.0e-9
n_phases = 3
T_ref    = 900.0
a        = 0.0,  -8.0e6,  -7.5e6
b        = 0.0,   2.0e7,  -1.0e7
c2       = 0.0,   2.5e8,   1.8e8
dT       = 0.0,   1.0e4,   5.0e3

[initial]
c0          = 0.06
T0          = 820.0     # well below T_ref → large dT*(T-T_ref) term
n_seeds     = 24
seed_radius = 2
seed        = 654

[output]
format  = csv
dir     = output/precipitation/low_temperature_2d
prefix  = snap
compact = false
