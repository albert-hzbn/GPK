# ============================================================
#  GPK Recrystallisation — 3-D input file
#  Physics: stored dislocation energy drives rex grain growth
#           Avrami (JMAK) kinetics
# ============================================================

[run]
model = recrystallisation

[grid]
Nz    = 32
Ny    = 64
Nx    = 64
dx    = 1.0e-6      # [m]

[time]
t_end   = 200.0     # [s]
n_snaps = 10

[thermo]
M0      = 1.0e-12   # realistic Al boundary mobility
sigma0  = 0.3       # [J/m^2]
eps4    = 0.0
D       = 0.0
E_stored = 1.0e6    # stored dislocation energy [J/m^3]

[nucleation]
n_nuclei   = 40
nucleus_r  = 3      # nucleus radius [cells]
Jdot       = 5.0e13 # Zener-Hillert nucleation rate [1/(m^3 s)]
seed       = 42

[output]
format  = csv
dir     = output/recrystallisation
prefix  = snap
compact = false
