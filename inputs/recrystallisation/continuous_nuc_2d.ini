# ============================================================
#  GPK Recrystallisation — 2-D continuous (Zener-Hillert) nucleation
#  Few pre-placed seeds + ongoing stochastic nucleation driven by Jdot.
#  Mimics site-saturation → site-continuous transition.
# ============================================================

[run]
model = recrystallisation

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 1.0e-6

[time]
t_end   = 200.0
n_snaps = 10

[thermo]
M0       = 1.0e-12
sigma0   = 0.3
E_stored = 1.0e6

[nucleation]
n_nuclei  = 5            # very few pre-placed seeds
nucleus_r = 3
Jdot      = 5.0e13       # Zener-Hillert nucleation rate [1/(m^3·s)]
seed      = 77

[output]
format  = csv
dir     = output/recrystallisation/continuous_nuc_2d
prefix  = snap
compact = false
