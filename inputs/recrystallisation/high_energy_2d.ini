# ============================================================
#  GPK Recrystallisation — 2-D high stored energy
#  E_stored = 5e6 J/m³ (heavily cold-worked alloy).
#  Fast nucleation and rapid consumption of deformed matrix.
# ============================================================

[run]
model = recrystallisation

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 1.0e-6

[time]
t_end   = 50.0      # shorter — faster kinetics
n_snaps = 10

[thermo]
M0       = 1.0e-12
sigma0   = 0.3
E_stored = 5.0e6    # 5× more stored energy

[nucleation]
n_nuclei  = 60
nucleus_r = 3
Jdot      = 0.0
seed      = 55

[output]
format  = csv
dir     = output/recrystallisation/high_energy_2d
prefix  = snap
compact = false
