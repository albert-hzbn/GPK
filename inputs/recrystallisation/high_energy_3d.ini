# ============================================================
#  GPK Recrystallisation — 3-D high stored energy + continuous nucleation
#  3-D domain; severe deformation (E_stored = 3e6) with Jdot nucleation.
# ============================================================

[run]
model = recrystallisation

[grid]
Nz    = 32
Ny    = 64
Nx    = 64
dx    = 1.0e-6

[time]
t_end   = 80.0
n_snaps = 10

[thermo]
M0       = 1.0e-12
sigma0   = 0.3
E_stored = 3.0e6

[nucleation]
n_nuclei  = 10
nucleus_r = 3
Jdot      = 2.0e13
seed      = 33

[output]
format  = vtk
dir     = output/recrystallisation/high_energy_3d
prefix  = snap
compact = false
