# ============================================================
#  GPK Recrystallisation — 2-D standard
#  Pre-placed nuclei grow into deformed matrix.
#  Avrami (JMAK) kinetics: X = 1 − exp(−k·tⁿ)
# ============================================================

[run]
model = recrystallisation

[grid]
Nz    = 1           # 2-D
Ny    = 128
Nx    = 128
dx    = 1.0e-6

[time]
t_end   = 200.0     # [s]
n_snaps = 10

[thermo]
M0       = 1.0e-12  # Al boundary mobility [m^3/(J*s)]
sigma0   = 0.3      # [J/m^2]
E_stored = 1.0e6    # stored dislocation energy [J/m^3]

[nucleation]
n_nuclei  = 40
nucleus_r = 3       # nucleus radius [cells]
Jdot      = 0.0     # no continuous nucleation
seed      = 42

[output]
format  = csv
dir     = output/recrystallisation/standard_2d
prefix  = snap
compact = false
