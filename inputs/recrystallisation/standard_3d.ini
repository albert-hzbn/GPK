# ============================================================
#  GPK Recrystallisation — 3-D standard
#  3-D pre-placed nuclei; realistic Al parameters.
# ============================================================

[run]
model = recrystallisation

[grid]
Nz    = 32
Ny    = 64
Nx    = 64
dx    = 1.0e-6

[time]
t_end   = 200.0
n_snaps = 10

[thermo]
M0       = 1.0e-12
sigma0   = 0.3
E_stored = 1.0e6

[nucleation]
n_nuclei  = 40
nucleus_r = 3
Jdot      = 0.0
seed      = 42

[output]
format  = csv
dir     = output/recrystallisation/standard_3d
prefix  = snap
compact = false
