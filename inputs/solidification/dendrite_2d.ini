# ============================================================
#  GPK Solidification — 2-D dendritic (Al-Cu-like)
#  Binary alloy, 4-fold anisotropy → classical dendrite arms.
#  Undercooling 5 K with solute redistribution.
# ============================================================

[run]
model = solidification

[grid]
Nz    = 1           # 2-D
Ny    = 128
Nx    = 128
dx    = 0.5e-6      # [m]

[time]
t_end   = 2.0e-3    # [s]
n_snaps = 6

[thermo]
M0          = 5.0e-8
sigma0      = 0.20
eps4        = 0.04       # 4-fold anisotropy → dendrite arms
D           = 3.0e-9     # solute diffusivity [m^2/s]
m_liq       = -500.0     # liquidus slope [K/(mol frac)]
k_part      = 0.3        # partition coefficient
T_melt      = 933.0      # melting point [K]
L           = 1.0e8      # latent heat [J/m^3]
stochastic  = false
noise_scale = 1.0
elastic_enabled    = false
elastic_modulus    = 0.0
eigenstrain_coeff  = 0.0
c_ref              = 0.02
elastic_smooth_iters = 8

[initial]
c0           = 0.02      # initial solute [mol frac]
undercooling = 5.0       # dT [K]
seed_radius  = 4         # seed half-width [cells]

[output]
format  = csv
dir     = output/solidification/dendrite_2d
prefix  = snap
compact = false
