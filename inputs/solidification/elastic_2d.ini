# ============================================================
#  GPK Solidification — 2-D elastic eigenstrain coupling
#  Coherency strain from solute segregation feeds back into
#  the driving force via a smoothed Eshelby-type proxy.
#  eigenstrain_coeff = 0.05: moderate lattice misfit.
# ============================================================

[run]
model = solidification

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 2.0e-3
n_snaps = 6

[thermo]
M0          = 5.0e-8
sigma0      = 0.20
eps4        = 0.04
D           = 3.0e-9
m_liq       = -500.0
k_part      = 0.3
T_melt      = 933.0
L           = 1.0e8
stochastic  = false
noise_scale = 1.0
elastic_enabled      = true
elastic_modulus      = 5.0e9    # effective modulus [J/m^3]
eigenstrain_coeff    = 0.05     # ε* = coeff*(c − c_ref)
c_ref                = 0.02
elastic_smooth_iters = 8        # Jacobi smoothing passes

[initial]
c0           = 0.02
undercooling = 5.0
seed_radius  = 4

[output]
format  = csv
dir     = output/solidification/elastic_2d
prefix  = snap
compact = false
