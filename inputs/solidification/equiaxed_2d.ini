# ============================================================
#  GPK Solidification — 2-D equiaxed (low anisotropy)
#  Very low eps4 → compact, rounded grain; no pronounced arms.
#  Mild undercooling, slower growth.
# ============================================================

[run]
model = solidification

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 4.0e-3
n_snaps = 8

[thermo]
M0          = 5.0e-8
sigma0      = 0.20
eps4        = 0.005      # near-isotropic → equiaxed grain
D           = 3.0e-9
m_liq       = -500.0
k_part      = 0.3
T_melt      = 933.0
L           = 1.0e8
stochastic  = false
noise_scale = 1.0
elastic_enabled    = false
elastic_modulus    = 0.0
eigenstrain_coeff  = 0.0
c_ref              = 0.02
elastic_smooth_iters = 8

[initial]
c0           = 0.02
undercooling = 2.0       # mild undercooling → compact morphology
seed_radius  = 5

[output]
format  = csv
dir     = output/solidification/equiaxed_2d
prefix  = snap
compact = false
