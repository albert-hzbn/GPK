# ============================================================
#  GPK Solidification — 2-D high undercooling (supersaturated)
#  dT = 15 K → faster growth, finer side-branch spacing.
#  Demonstrates seaweed / fractal-like morphology at high ΔT.
# ============================================================

[run]
model = solidification

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 0.8e-3
n_snaps = 8

[thermo]
M0          = 5.0e-8
sigma0      = 0.20
eps4        = 0.04
D           = 3.0e-9
m_liq       = -500.0
k_part      = 0.3
T_melt      = 933.0
L           = 1.0e8
stochastic  = false
noise_scale = 1.0
elastic_enabled    = false
elastic_modulus    = 0.0
eigenstrain_coeff  = 0.0
c_ref              = 0.02
elastic_smooth_iters = 8

[initial]
c0           = 0.02
undercooling = 15.0      # strong undercooling
seed_radius  = 3

[output]
format  = csv
dir     = output/solidification/high_undercooling_2d
prefix  = snap
compact = false
