# ============================================================
#  GPK Solidification — 2-D stochastic kinetics
#  Thermal fluctuations (Box-Muller noise) perturb interface
#  velocity.  noise_scale = 2 gives visible side-branch initiation.
# ============================================================

[run]
model = solidification

[grid]
Nz    = 1
Ny    = 128
Nx    = 128
dx    = 0.5e-6

[time]
t_end   = 2.0e-3
n_snaps = 6

[thermo]
M0          = 5.0e-8
sigma0      = 0.20
eps4        = 0.04
D           = 3.0e-9
m_liq       = -500.0
k_part      = 0.3
T_melt      = 933.0
L           = 1.0e8
stochastic  = true       # enable stochastic noise
noise_scale = 2.0        # noise amplitude multiplier
elastic_enabled    = false
elastic_modulus    = 0.0
eigenstrain_coeff  = 0.0
c_ref              = 0.02
elastic_smooth_iters = 8

[initial]
c0           = 0.02
undercooling = 5.0
seed_radius  = 4

[output]
format  = csv
dir     = output/solidification/stochastic_2d
prefix  = snap
compact = false
