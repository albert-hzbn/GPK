# ============================================================
#  GPK Binary-Alloy Solidification — memory-safe 3-D example
# ============================================================

[run]
model = solidification

[grid]
Nz    = 64
Ny    = 64
Nx    = 64
dx    = 0.5e-6

[time]
t_end   = 2.0e-3
n_snaps = 6

[thermo]
M0      = 5.0e-8
sigma0  = 0.20
eps4    = 0.04
D       = 3.0e-9
m_liq   = -500.0
k_part  = 0.3
T_melt  = 933.0
L       = 1.0e8
stochastic = false
noise_scale = 1.0
elastic_enabled = false
elastic_modulus = 5.0e9
eigenstrain_coeff = 0.02
c_ref = 0.02
elastic_smooth_iters = 8

[initial]
c0           = 0.02
undercooling = 5.0
seed_radius  = 4

[output]
format  = vtk
dir     = output/solidification_3d
prefix  = snap
compact = false
