# ============================================================
# GPK Wulff-Shape Test, tensor anisotropy
#
# A single circular grain shrinks under:
# σ(n̂) = σ₀ √(bxx·nc_x² + byy·nc_y²)
#
# With bxx=1, byy=4:
# σ(n̂=x̂) = σ₀ (vertical faces cheap → slow shrinkage in x)
# σ(n̂=ŷ) = 2σ₀ (horizontal faces expensive → fast shrinkage in y)
#
# Result: grain becomes wider than tall (x/y ratio > 1), confirming
# that the tensor anisotropy acts in the correct direction.
# ============================================================

[run]
model = wulff_shape

[grid]
Nz = 1
Ny = 128
Nx = 128
dx = 1.0e-6

[time]
t_end = 0.06
n_snaps = 10

[thermo]
M0 = 1.0e-8
sigma0 = 0.5
bxx = 1.0
byy = 4.0
bzz = 1.0

[wulff]
seed_radius = 22

[output]
format = csv
dir = output/wulff_shape
prefix = snap
compact = false
