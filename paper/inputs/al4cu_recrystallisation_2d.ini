[run]
model = recrystallisation

[grid]
Nz = 1
Ny = 192
Nx = 192
dx = 1.0e-6

[geometry]
sigma_cells = 2.0

[time]
t_end = 360.0
n_snaps = 24

[thermo]
# Effective mobility calibrated once to the experimentally reported completion
# time (~300 s at 623.15 K) for 91% rotary-swaged Al-4.5 wt.% Cu.
M0 = 1.224e-13
sigma0 = 0.30
E_stored = 1.0e6

[nucleation]
n_nuclei = 40
nucleus_r = 3
Jdot = 0.0
seed = 42

[output]
format = csv
dir = output/al4cu_validation/recrystallisation_2d
prefix = snap
compact = false
write_initial = true
