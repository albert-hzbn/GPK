[run]
model = solidification
[grid]
Nz = 512
Ny = 512
Nx = 512
dx = 5.0e-7
[geometry]
sigma_cells = 2.0

[time]
t_end = 6.0e-2
n_snaps = 12
[thermo]
M0 = 2.0e-9
sigma0 = 0.20
eps4 = 0.04
D = 3.0e-9
m_liq = -500.0
k_part = 0.3
T_melt = 933.0
L = 1.0e8
stochastic = false
noise_scale = 1.0
elastic_enabled = true
