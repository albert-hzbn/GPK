c_ref = 0.02
elastic_smooth_iters = 12
solute_rejection = true
[initial]
c0 = 0.02
undercooling = 10.0
seed_radius = 4
[output]
format = csv
dir = output/fig8_large/dendrite_3d_512
prefix = snap
compact = false
write_initial = true

