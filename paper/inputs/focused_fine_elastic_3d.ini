[run]
model = solidification
[grid]
Nz = 128
Ny = 128
Nx = 128
dx = 2.5e-7
[geometry]
sigma_cells = 5.3333333

[time]
t_end = 6.0e-4
n_snaps = 1
[thermo]
M0 = 5.0e-8
sigma0 = 0.20
eps4 = 0.04
D = 3.0e-9
m_liq = -500.0
k_part = 0.3
T_melt = 933.0
L = 1.0e8
stochastic = false
noise_scale = 1.0
elastic_enabled = true
elastic_modulus = 5.0e9
eigenstrain_coeff = 0.05
c_ref = 0.02
elastic_smooth_iters = 12
[initial]
c0 = 0.02
undercooling = 5.0
seed_radius = 6
[output]
format = csv
dir = output/manuscript_high_resolution/elastic_3d
prefix = snap
compact = false
write_initial = true
