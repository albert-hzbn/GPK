[run]
model = grain_growth

[grid]
Nz = 32
Ny = 64
Nx = 64
dx = 1.0e-6

[time]
t_end = 0.020
n_snaps = 4

[thermo]
M0 = 1.0e-8
sigma0 = 0.5
eps4 = 0.0
D = 0.0

[output]
format = csv
dir = output/manuscript_gallery/grain_growth_isotropic_3d
prefix = snap
compact = false

[grain_growth]
n_grains = 40
seed = 42
