[run]
model = recrystallisation

[grid]
Nz = 1
Ny = 128
Nx = 128
dx = 1.0e-6

[time]
t_end = 10.0
n_snaps = 4

[thermo]
M0 = 1.0e-12
sigma0 = 0.3
E_stored = 1.0e6

[nucleation]
n_nuclei = 40
nucleus_r = 3
Jdot = 0.0
seed = 42

[output]
format = csv
dir = output/manuscript_gallery/recrystallisation_standard_2d
prefix = snap
compact = false
