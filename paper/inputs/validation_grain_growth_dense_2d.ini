[run]
model = grain_growth

[grid]
Nz = 1
Ny = 512
Nx = 512
dx = 2.5e-7

[geometry]
sigma_cells = 4.0

[time]
t_end = 10.00
n_snaps = 24

[thermo]
M0 = 5.0e-11
sigma0 = 0.324
eps4 = 0.0
